[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brg-mcp"
version = "0.1.0"
description = "MCP server of the Block Research Group"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastmcp==4.1.8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff"]

[project.scripts]
brg-mcp = "brg_mcp.server:mcp.run"
brg-publish = "brg_mcp.teaching:main"

[tool.ruff]
line-length = 179
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]
isort = { force-single-line = true }
